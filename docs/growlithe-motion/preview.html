<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../../src/"><title>Growlithe motion review</title><style>
body{font:16px system-ui;background:#eee7da;color:#302c28;padding:24px}button{margin:3px;padding:8px}.viewport{width:180px;height:150px;border:1px dashed #92877a;margin:24px;position:relative;background:#eee7da;overflow:hidden}.growlithe{position:absolute;left:35px;top:25px;width:120px;height:100px;transform-origin:50% 82%}.growlithe-sprite{position:absolute;left:14px;top:-4px;width:92px;height:92px;image-rendering:pixelated}.growlithe-full-frame{left:-25px;top:-25px;width:170px;height:150px}img{user-select:none}#status{font-family:monospace}
</style></head><body><h1>Growlithe motion review</h1><p>Exact 180 × 150 display. The module owns frame timing and priority; frames retain the original pixel scale.</p>
<div id="controls"></div><button id="flame">Flamethrower</button><button id="direction">Reverse facing</button><button id="background">Light / dark</button>
<div class="viewport"><div id="pet" class="growlithe"><img class="growlithe-sprite" src="assets/characters/growlithe-hgss.png" alt="Growlithe"></div></div><p id="status"></p>
<script src="characters/growlithe.js"></script><script>
const states={IDLE:'idle',WALK:'walk',SIT:'sit',SLEEP:'sleep',REACT:'react',DRAG:'drag'};
const pet=new GrowlitheCharacter(document.querySelector('#pet'),states);
for(const state of Object.values(states)){const b=document.createElement('button');b.textContent=state;b.onclick=()=>pet.setState(state);document.querySelector('#controls').append(b);}
document.querySelector('#flame').onclick=()=>pet.startSpecialAction('flamethrower');
document.querySelector('#direction').onclick=()=>pet.setFacing(-pet.facing);
let dark=false;document.querySelector('#background').onclick=()=>{dark=!dark;document.querySelector('.viewport').style.background=dark?'#202734':'#eee7da';};
function tick(now){pet.render(now);document.querySelector('#status').textContent=pet.isSpecialActionActive()?'Flamethrower (drag interrupts)':'State: '+pet.state;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
