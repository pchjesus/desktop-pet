name: Desktop Pet Fast Regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Private-ready B+: superseded PR checks may be cancelled; main is protected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: B+ risk classification
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/ci-scope.sh --self-test
          bash scripts/ci-scope.sh
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.tier != 'docs'
        with:
          node-version: '22'
          cache: npm
      - name: Install locked metadata without downloading Electron runtime
        if: steps.scope.outputs.tier != 'docs'
        run: npm ci --ignore-scripts
      - name: JavaScript syntax
        if: steps.scope.outputs.tier != 'docs'
        run: npm run check
      - name: Node-only existing regression
        if: steps.scope.outputs.tier != 'docs'
        run: npm test
# Windows .exe building, window hit-testing and end-user device validation remain
# separate manual/Windows release checks and are NOT covered by this Linux job.
