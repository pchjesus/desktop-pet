name: Desktop Pet Home and Motion Windows Preview

on:
  push:
    branches: [feat/canine-soft-runtime, feat/pachirisu-growlithe-integration, feat/pet-home-size-meteors]
    paths:
      - ".github/workflows/windows-canine-preview.yml"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "VERIFY-WINDOWS.bat"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked packages
        run: npm ci
      - name: Prepare Windows Electron
        run: |
          npm run prepare:electron
          npm run verify:electron
      - name: JavaScript and character regression
        run: |
          npm run check
          npm test
          npm run test:shell
      - name: Asset regression (Pillow)
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -B test/spheal-assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('test/pachirisu-assets.py', 'test/growlithe-assets.py')) {
            if (Test-Path $test) {
              python -B $test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Validate standalone puppy previews
        shell: pwsh
        run: |
          python -c "import xml.etree.ElementTree as E; [E.parse('src/assets/characters/'+n+'.svg') for n in ('neukgu','royce')]; print('Puppy SVGs: PASS')"
      - name: Native home, cancel, exit and repeated character switching
        run: node node_modules/electron/cli.js scripts/verify-home-electron.cjs
      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Portable EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/DesktopPet-0.1.12-portable.exe')) {
            throw 'Portable EXE missing'
          }
          Get-Item 'dist/DesktopPet-0.1.12-portable.exe' | Select-Object Name,Length
      - name: Packaged renderer smoke (portable launcher may fork Electron child)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/DesktopPet-0.1.12-portable.exe'
          $preexisting = @(Get-ChildItem -Path $env:TEMP -Filter 'desktop-pet-smoke-*.ready' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $started = Get-Date
          $launcher = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          $marker = $null
          $petPid = $null
          try {
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              $marker = Get-ChildItem -Path $env:TEMP -Filter 'desktop-pet-smoke-*.ready' -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -gt $started.AddSeconds(-2) -and $preexisting -notcontains $_.FullName } |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($marker) {
                $readyInfo = Get-Content $marker.FullName -Raw | ConvertFrom-Json
                $petPid = [int]$readyInfo.pid
                if (Get-Process -Id $petPid -ErrorAction SilentlyContinue) {
                  Write-Host ('Packaged Electron child renderer ready, PID=' + $petPid)
                  break
                }
                $marker = $null
              }
            }
            if (!$marker) { throw 'Renderer marker not found after portable extraction; inspect Windows GUI runner restrictions' }
            Write-Host 'Packaged EXE smoke: PASS'
          } finally {
            if ($petPid) { Stop-Process -Id $petPid -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            if ($marker) { Remove-Item $marker.FullName -Force -ErrorAction SilentlyContinue }
          }
      - name: Verify user-facing Windows BAT against packaged portable EXE
        shell: cmd
        run: call VERIFY-WINDOWS.bat
      - name: Upload preview EXE
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Home-Motion-Windows
          path: dist/DesktopPet-0.1.12-portable.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
