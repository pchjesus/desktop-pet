name: Export verified Desktop Pet main source

on:
  push:
    branches: [chore/local-pachirisu-source-export]
    paths: [".github/workflows/local-pachirisu-source.yml"]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e2780572fcca7e7f421ceaa8fcb11606c8e9c1f
      - name: Verify pinned main and local Windows smoke script
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1e2780572fcca7e7f421ceaa8fcb11606c8e9c1f"
          grep -q 'Electron PID=' VERIFY-WINDOWS.bat
          grep -q 'Packaged Electron renderer was not ready within 60 seconds' VERIFY-WINDOWS.bat
          echo "Source pinned to 1e2780572fcca7e7f421ceaa8fcb11606c8e9c1f"
      - name: Archive complete tracked source from main
        run: git archive --format=zip -o desktop-pet-main-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-Main-Verified-Source
          path: desktop-pet-main-source.zip
          retention-days: 2
