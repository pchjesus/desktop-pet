<svg xmlns="http://www.w3.org/2000/svg" class="neukgu-concept" data-motion="still" viewBox="0 0 96 88" role="img" aria-labelledby="n-title n-desc">
<title id="n-title">Neukgu — angular silver wolf concept</title>
<desc id="n-desc">Original block-wolf identity, tapered cheek planes, upright ears, connected bushy tail, articulated paws. Review concept only.</desc>
<style>
.neukgu-concept{--cycle:900ms;overflow:visible}
.neukgu-concept .eye-closed{display:none}
.neukgu-concept[data-motion="idle"] .core{animation:n-breathe 2400ms ease-in-out infinite}
.neukgu-concept[data-motion="idle"] .tail{transform-box:view-box;transform-origin:30px 44px;animation:n-tail 3200ms ease-in-out infinite}
.neukgu-concept[data-motion="idle"] .ear-near{transform-origin:66px 25px;animation:n-ear 4600ms ease-in-out infinite}
.neukgu-concept[data-motion="idle"] .eye-open{animation:n-blink 5200ms steps(1) infinite}
.neukgu-concept[data-motion="idle"] .eye-closed{display:inline;opacity:0;animation:n-lid 5200ms steps(1) infinite}
.neukgu-concept[data-motion="walk"] .core{animation:n-load var(--cycle) ease-in-out infinite}
.neukgu-concept[data-motion="walk"] .leg-track{animation:n-stride var(--cycle) linear infinite}
.neukgu-concept[data-motion="walk"] .far-front{animation-delay:-450ms}
.neukgu-concept[data-motion="walk"] .near-hind{animation-delay:-675ms}
.neukgu-concept[data-motion="walk"] .far-hind{animation-delay:-225ms}
.neukgu-concept[data-motion="walk"] .head{animation:n-head var(--cycle) ease-in-out infinite}
@keyframes n-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1)}}
@keyframes n-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes n-ear{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-5deg)}94%{transform:rotate(2deg)}}
@keyframes n-blink{0%,93%,97%,100%{opacity:1}94%,96%{opacity:0}}
@keyframes n-load{0%,50%,100%{transform:translateY(.6px)}25%,75%{transform:translateY(-.4px)}}
@keyframes n-head{0%,50%,100%{transform:translateY(-.4px)}25%,75%{transform:translateY(.3px)}}
@keyframes n-stride{0%{transform:translate(3px,0)}60%{transform:translate(-3px,0)}72%{transform:translate(-2px,-4px)}86%{transform:translate(1px,-4px)}100%{transform:translate(3px,0)}}
@keyframes n-lid{0%,93%,97%,100%{opacity:0}94%,96%{opacity:1}}
@media(prefers-reduced-motion:reduce){.neukgu-concept *{animation:none!important}}
</style>
