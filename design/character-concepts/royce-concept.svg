<svg xmlns="http://www.w3.org/2000/svg" class="royce-concept" data-motion="still" viewBox="0 0 96 88" role="img" aria-labelledby="r-title r-desc">
<title id="r-title">Royce — black and tan companion concept</title>
<desc id="r-desc">Broader chest, shorter grounded legs, folded ear tips, warm eyebrow markings and low connected tail distinguish Royce from Neukgu. Review concept only.</desc>
<style>
.royce-concept{--cycle:1100ms;overflow:visible}
.royce-concept .eye-closed{display:none}
.royce-concept[data-motion="idle"] .core{animation:r-breathe 2800ms ease-in-out infinite}
.royce-concept[data-motion="idle"] .tail{transform-origin:27px 47px;animation:r-tail 2400ms ease-in-out infinite}
.royce-concept[data-motion="idle"] .ear-near{transform-origin:65px 27px;animation:r-ear 5000ms ease-in-out infinite}
.royce-concept[data-motion="idle"] .eye-open{animation:r-blink 5700ms steps(1) infinite}
.royce-concept[data-motion="idle"] .eye-closed{display:inline;opacity:0;animation:r-lid 5700ms steps(1) infinite}
.royce-concept[data-motion="walk"] .core{animation:r-load var(--cycle) ease-in-out infinite}
.royce-concept[data-motion="walk"] .leg-track{animation:r-stride var(--cycle) linear infinite}
.royce-concept[data-motion="walk"] .far-front{animation-delay:-550ms}
.royce-concept[data-motion="walk"] .near-hind{animation-delay:-825ms}
.royce-concept[data-motion="walk"] .far-hind{animation-delay:-275ms}
.royce-concept[data-motion="walk"] .head{animation:r-head var(--cycle) ease-in-out infinite}
@keyframes r-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
@keyframes r-tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}
@keyframes r-ear{0%,89%,100%{transform:rotate(0)}93%{transform:rotate(4deg)}97%{transform:rotate(-1deg)}}
@keyframes r-blink{0%,94%,98%,100%{opacity:1}95%,97%{opacity:0}}
@keyframes r-load{0%,50%,100%{transform:translateY(.8px)}25%,75%{transform:translateY(-.3px)}}
@keyframes r-head{0%,50%,100%{transform:translateY(-.5px)}25%,75%{transform:translateY(.2px)}}
@keyframes r-stride{0%{transform:translate(2.5px,0)}64%{transform:translate(-2.5px,0)}76%{transform:translate(-1.5px,-3px)}88%{transform:translate(1.5px,-3px)}100%{transform:translate(2.5px,0)}}
@keyframes r-lid{0%,94%,98%,100%{opacity:0}95%,97%{opacity:1}}
@media(prefers-reduced-motion:reduce){.royce-concept *{animation:none!important}}
</style>
<g class="model" stroke-linejoin="round">
 <g id="r-leg-far-hind" class="leg-track far-hind" data-pivot="31,55"><path d="M26 52h12l-2 12-5 6v7h-9v-4l4-5Z" fill="#67452f"/><path d="M23 74h9l2 2v3H21v-3Z" fill="#a77549"/></g>
 <g id="r-leg-far-front" class="leg-track far-front" data-pivot="58,53"><path d="M54 49h11l-2 19-2 7 4 1v3H51l1-8Z" fill="#6d4933"/><path d="M52 75h11l2 2v2H51Z" fill="#b18053"/></g>
 <g id="r-core" class="core">
  <g id="r-tail" class="tail" data-pivot="27,47"><path d="M29 44 21 43 15 40 11 34 6 35 5 41 11 48 20 52 30 51Z" fill="#252f3b" stroke="#5a6875"/><path d="m6 36 4-1 4 6-3 3-4-3Z" fill="#a76f41"/><path d="m15 43 9 3 5 1-1 2-9-1Z" fill="#46505b"/></g>
  <g id="r-body"><path d="M24 40 34 35 52 35 65 40 72 51 68 62 57 66 31 64 22 57 20 48Z" fill="#252f3b" stroke="#5a6875"/><path d="m26 41 10-3 18 1 9 5-5 5-26-1Z" fill="#3e4b57"/><path d="M22 50 31 57 53 59 69 52l-3 10-11 3-23-2-8-5Z" fill="#192430"/><path d="M47 47 57 44l9 8-7 10-10-1Z" fill="#684b37"/></g>
  <g id="r-neck"><path d="m56 46-2-14 10-6 12 7 1 18-9 13-9-5Z" fill="#303c48" stroke="#5a6875"/><path d="m62 40 9-1 1 12-7 10-6-5Z" fill="#b18153"/><path d="m65 43 6-2-1 10-5 7-3-3Z" fill="#d5a16a"/></g>
  <g id="r-head" class="head" data-pivot="66,39">
   <g id="r-ear-far"><path d="m77 26 1-13 7 3 4 9-6 9Z" fill="#1c2733" stroke="#5a6875"/><path d="m80 17 5 3-2 8-3-3Z" fill="#71503d"/></g>
   <path d="M59 26 68 21 82 23 89 30 89 43 82 50 66 48 58 40 56 32Z" fill="#2d3946" stroke="#5a6875"/>
