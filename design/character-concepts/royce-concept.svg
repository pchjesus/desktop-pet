   <g id="r-eyes-closed" class="eye-closed" stroke="#c7915b" fill="none"><path d="m65 36 3-1 3 1m8 0 3-1 2 1"/></g>
   <path d="m66 39 7-1 7-1 9 2 5 5-2 5-9 3-13-4-6-4Z" fill="#bc8956" stroke="#604c3e" stroke-width=".8"/>
   <path d="m72 45 10 2 10-2-1 4-9 3-9-3Z" fill="#d5a571"/>
   <path d="m86 38 7 1 2 3-3 3-6-1-2-3Z" fill="#14212c"/><path d="m87 39 4 1v1h-4Z" fill="#54616a"/>
   <path d="m85 45-2 2-5 1-4-2" fill="none" stroke="#674935" stroke-width=".9"/>
  </g>
 </g>
 <g id="r-leg-near-hind" class="leg-track near-hind" data-pivot="31,56"><path d="m24 52 10-1 6 6-2 9-6 5v5l5 1v3H21v-5l5-6 1-8-4-4Z" fill="#97683f" stroke="#5d4836"/><path d="m27 55 5-1 4 4-2 7-5 3 1-8Z" fill="#bd8c58"/><path d="M23 76h10l4 2v2H21Z" fill="#d0a06a"/><path d="M27 78v2m4-2v2" stroke="#916c49" stroke-width=".8"/></g>
 <g id="r-leg-near-front" class="leg-track near-front" data-pivot="67,54"><path d="M61 51h12l-1 14-3 11 5 1v3H57l1-6 2-13Z" fill="#b4824f" stroke="#654b36"/><path d="M64 55h5l-2 16h-5Z" fill="#d09c62"/><path d="M59 76h12l3 2v2H57Z" fill="#deb47e"/><path d="M63 78v2m5-2v2" stroke="#9a754c" stroke-width=".8"/></g>
