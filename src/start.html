<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Pet</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #f7f7f7, #ececec);
    color: #2b2b2b;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 340px;
    padding: 34px 30px 30px;
    text-align: center;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
  p { margin: 10px 0 26px; color: #666; font-size: 13px; line-height: 1.6; }
  .buttons { display: grid; gap: 10px; }
  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    font: 700 14px system-ui, sans-serif;
    cursor: pointer;
  }
  #start { background: #333; color: #fff; }
  #manual { background: #fff; color: #333; box-shadow: 0 0 0 1px #ddd inset; }
  button:hover { filter: brightness(.96); }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <h1>Desktop Pet</h1>
    <p>바탕화면에서 함께 지내는 작은 펫입니다.<br>준비가 되었다면 시작해 보세요.</p>
    <div class="buttons">
      <button id="manual" type="button">설명서</button>
      <button id="start" type="button">시작</button>
    </div>
  </main>
  <script>
    document.getElementById('start').addEventListener('click', () => window.startAPI.start());
    document.getElementById('manual').addEventListener('click', () => window.startAPI.openManual());
  </script>
</body>
</html>
